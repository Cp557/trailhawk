<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailhawk flight simulator</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16191d; color: #f2f2f2; font: 13px/1.4 system-ui, sans-serif; }
  /* The chase view on the left 3/4; the panel on the right 1/4. app.js draws both views on #scene,
     which fills the window behind them, into the boxes of #view and #camera. */
  body { display: grid; grid-template-columns: 3fr 1fr; }
  [hidden] { display: none !important; }
  #scene { position: fixed; inset: 0; display: block; }
  #side { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; padding: 14px; font-variant-numeric: tabular-nums; }
  #mode { font-weight: 700; letter-spacing: 0.06em; color: #ff9a52; }
  #camera { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; outline: 1px solid rgba(255, 255, 255, 0.18); }
  #camera span { position: absolute; top: 6px; left: 8px; font-size: 11px; text-shadow: 0 1px 2px #000; }
  #readings { border-collapse: collapse; }
  #readings td { padding: 1px 0; vertical-align: top; }
  #readings td:first-child { padding-right: 12px; color: #9aa0a6; white-space: nowrap; }
  #map { position: relative; flex: 1; min-height: 140px; }
  #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: top; }
  #found { font-size: 12px; color: #cfd3d7; }
  #side a { color: #ff9a52; }
  #message { position: fixed; top: 38%; left: 37.5%; transform: translate(-50%, -50%); padding: 10px 14px; border-radius: 8px; background: rgba(16, 18, 22, 0.74); font-size: 20px; text-align: center; }
  #message.warning { color: #ffcf6e; }
  @media (max-aspect-ratio: 1/1) { /* portrait: the chase view on top; below, the camera and readings beside the map */
    body { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    #side { display: grid; grid-template: "mode mode" auto "camera map" auto "readings map" 1fr "found link" auto / 1fr 1fr; gap: 8px 12px; padding: 10px 12px; }
    #mode { grid-area: mode; }
    #camera { grid-area: camera; }
    #readings { grid-area: readings; }
    #map { grid-area: map; }
    #found { grid-area: found; }
    #side a { grid-area: link; }
    #message { top: 27%; left: 50%; font-size: 16px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<aside id="side">
  <div id="mode"></div>
  <div id="camera"><span>Drone camera</span></div>
  <table id="readings"></table>
  <div id="map"><canvas width="600" height="600"></canvas></div>
  <div id="found"></div>
  <a href="../">&larr; The model in 3D</a>
</aside>
<div id="message">Loading the model&hellip;</div>
<script type="module" src="app.js"></script>
</body>
</html>
