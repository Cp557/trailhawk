<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailhawk flight simulator</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16191d; color: #f2f2f2; font: 13px/1.4 system-ui, sans-serif; }
  /* The chase view on the left 3/4; the panel on the right 1/4. app.js draws both views on #scene,
     which fills the window behind them, into the boxes of #view and #camera; the canvas in #camera
     holds its detection boxes, and the bar under it names the camera and swaps it. */
  body { display: grid; grid-template-columns: 3fr 1fr; }
  [hidden] { display: none !important; }
  #scene { position: fixed; inset: 0; display: block; }
  #side { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow-y: auto; padding: 14px; font-variant-numeric: tabular-nums; }
  #top { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #top p { margin: 0; font-size: 12px; color: #cfd3d7; }
  #feed { flex: none; display: flex; flex-direction: column; gap: 5px; }
  #feed > div:last-child { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #cfd3d7; }
  #feed button { padding: 1px 8px; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; background: none; color: #f2f2f2; font: 11px system-ui, sans-serif; cursor: pointer; }
  #camera { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; outline: 1px solid rgba(255, 255, 255, 0.18); }
  #camera canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #readings { border-collapse: collapse; }
  #readings td { padding: 1px 0; vertical-align: top; }
  #readings td:first-child { padding-right: 12px; color: #9aa0a6; white-space: nowrap; }
  #map { position: relative; flex: 1; min-height: 140px; }
  #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: top; }
  #found { font-size: 12px; color: #cfd3d7; }
  #side a { color: #ff9a52; }
  #message { position: fixed; top: 38%; left: 37.5%; transform: translate(-50%, -50%); padding: 10px 14px; border-radius: 8px; background: rgba(16, 18, 22, 0.74); font-size: 20px; text-align: center; }
  #message.warning { color: #ffcf6e; }
  /* Until app.js is ready: a spinner over everything */
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #16191d; }
  #loading::after { content: ""; width: 34px; height: 34px; border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: #ff9a52; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (max-aspect-ratio: 1/1) { /* portrait: the chase view on top; below, the camera and readings beside the map, the page scrolling when they don't fit */
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; overflow-y: auto; }
    #side { display: grid; grid-template: "top top" auto "camera map" auto "readings map" 1fr "found found" auto / 1fr 1fr; gap: 8px 12px; overflow: visible; padding: 10px 12px; }
    #top { grid-area: top; }
    #feed { grid-area: camera; }
    #readings { grid-area: readings; }
    #map { grid-area: map; }
    #found { grid-area: found; }
    #message { top: 27%; left: 50%; font-size: 16px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<aside id="side">
  <div id="top">
    <a href="../">&larr; The model in 3D</a>
    <p>Trailhawk circles you autonomously from 100 m up as you hike to a lake, its cameras scanning the trail ahead. Wildlife it spots is boxed in the camera view and pinned on the map.</p>
  </div>
  <div id="feed"><div id="camera"><canvas></canvas></div><div><span>Color camera</span><button>Thermal</button></div></div>
  <table id="readings"></table>
  <div id="map"><canvas width="600" height="600"></canvas></div>
  <div id="found"></div>
</aside>
<div id="message" hidden></div>
<div id="loading"></div>
<script type="module" src="app.js"></script>
</body>
</html>
